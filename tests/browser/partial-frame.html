<!doctype html>
<meta charset="utf-8">
<title>Partial frame regression</title>
<style>
html,body { margin:0; background:#fff; overflow:hidden; }
#marker { position:fixed; left:0; top:0; width:16px; height:16px; background:#f0f; }
#status { position:fixed; left:32px; top:32px; font:16px monospace; }
#arena { position:fixed; left:32px; top:96px; width:720px; height:288px;
         border:2px solid #000; background:#fff; overflow:hidden; }
#tile { position:absolute; width:64px; height:32px; background:rgb(240,40,20);
        will-change:transform; }
</style>
<div id="marker"></div>
<div id="status">Partial frame: one moving rectangle; no trails allowed.</div>
<div id="arena"><div id="tile"></div></div>
<script>
const tile = document.getElementById('tile');
let frame = 0;
function animate() {
  const step = Math.floor(frame++ / 2);
  tile.style.transform = `translate(${step % 41 * 16}px,${Math.floor(step / 41) % 3 * 80}px)`;
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
